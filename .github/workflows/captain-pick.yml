name: FPL Captain Pick

on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC daily; adjust to whatever time suits you
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pick:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run captaincy picker
        run: |
          ARGS="--notify --deadline-window-hours 36"
          if [ -n "$FPL_TEAM_ID" ]; then
            ARGS="$ARGS --team-id $FPL_TEAM_ID"
          fi
          python main.py $ARGS

      - name: Run transfer suggester
        if: ${{ env.FPL_TEAM_ID != '' }}
        run: python transfers.py --team-id "$FPL_TEAM_ID" --notify --deadline-window-hours 36

      - name: Commit updated logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in predictions_log.csv transfer_suggestions_log.csv; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "Log GW prediction and transfer suggestions"
          git diff --cached --quiet || git push
